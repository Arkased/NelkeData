name: Site

on:
  push:
    branches: [main]
    paths:
      - 'prototype/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Copy the site files
        run: |
          mkdir _site
          cp prototype/index.html prototype/app.js prototype/data.js prototype/style.css _site/
          cp -r prototype/fonts prototype/img _site/
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
